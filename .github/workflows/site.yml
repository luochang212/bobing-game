# 讲解页部署：照搬 adr-kit 的 site.yml 模式。
# 站点内容随双指针变化：current（桌内版本）与 scope（单桌/多桌，决定加赛页与加赛纸 PDF 是否部署）。
name: site

on:
  push:
    branches: [main]
    paths: ['site/**', 'versions/**', 'champion-final/**', 'current', 'scope', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: 附上规则纸 PDF（加赛纸随场景）
        run: |
          cp output/pdf/rules-paper.pdf site/dist/rules-paper.pdf
          if [ "$(cat scope)" = "multi" ]; then
            cp output/pdf/champion-final.pdf site/dist/champion-final.pdf
          else
            [ ! -e site/dist/champion-final ] \
              || { echo "失败：scope=single 但构建产物含加赛页——加赛页路由应随场景缺席"; exit 1; }
            echo "单桌场景：不部署加赛页与加赛纸"
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
